[package]
name = "zapret-manager"
version = "0.1.0"
description = "Zapret Manager — управление стратегиями обхода блокировок"
authors = ["Zapret Manager Project"]
edition = "2021"
rust-version = "1.98"

[lib]
name = "zapret_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2.4.0"
tauri-plugin-fs = "2.6.0"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-notification = "2.5.1"
tauri-plugin-updater = "2.13.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-autostart = "2"
tokio = { version = "1.53.2", features = ["full"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sha2 = "0.11.0"
hex = "0.4.3"
base64 = "0.22"
semver = "1"
zip = { version = "2", default-features = false, features = [
  "deflate",
] }
futures-util = "0.3"
regex = "1.13.1"
walkdir = "2.5.0"
once_cell = "1.21.4"
subtle = "2.6.1"
url = "2.5.4"
zeroize = "1.8.1"
sysinfo = "0.39.6"
winapi = { version = "0.3.9", features = [
  "shellapi",
  "processthreadsapi",
  "handleapi",
  "errhandlingapi",
  "winbase",
  "minwinbase",
  "winnt",
  "winuser",
  "wingdi",
  "libloaderapi",
  "fileapi",
  "iphlpapi",
  "synchapi",
  "winreg",
  "wininet",
  "winerror",
] }
reqwest = { version = "0.13.5", default-features = false, features = [
  "json",
  "rustls",
  "http2",
  "charset",
  "stream",
] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
incremental = false
