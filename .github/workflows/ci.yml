name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint and types
    runs-on: windows-latest
    defaults:
      run:
        working-directory: zapret-manager
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: zapret-manager/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      - name: Prettier
        run: pnpm format:check

      - name: Dead code
        run: pnpm lint:dead

      - name: Hardcoded strings
        run: pnpm lint:i18n

      - name: UI CSS contract
        run: pnpm lint:css

      - name: Release metadata
        if: github.ref == 'refs/heads/main'
        run: pnpm lint:release

  test-frontend:
    name: Frontend unit tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: zapret-manager
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: zapret-manager/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Vitest with coverage
        run: pnpm test:coverage

  test-rust:
    name: Rust tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: zapret-manager
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  e2e:
    name: Playwright E2E
    runs-on: windows-latest
    defaults:
      run:
        working-directory: zapret-manager
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: zapret-manager/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: E2E
        run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: zapret-manager/playwright-report/
          retention-days: 7

  build:
    name: Bundle build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: zapret-manager
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: zapret-manager/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Build installers
        run: pnpm tauri build

      - name: Bundle size limits
        run: pnpm perf:check

      - name: Build protection
        run: pnpm lint:protection

      - name: Check links in built bundle
        run: pnpm lint:bundle

      - name: Collect artifacts
        run: node scripts/release-artifacts.mjs

      - name: Verify portable bundle
        run: node scripts/verify-portable.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: |
            zapret-manager/release/*.exe
            zapret-manager/release/*.msi
            zapret-manager/release/*.zip
            zapret-manager/release/SHA256SUMS.txt
          retention-days: 7
