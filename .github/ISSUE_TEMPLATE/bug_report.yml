name: Bug Report
description: Сообщить о проблеме
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за сообщение! Заполните форму ниже — так проблему можно будет воспроизвести и исправить.

  - type: input
    id: version
    attributes:
      label: Версия приложения
      description: "Настройки → О приложении"
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Версия Windows
      placeholder: "Windows 11 24H2 (build 22631.4460)"
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Режим работы
      options:
        - Обход через DPI (стратегия)
        - VPN (WireGuard / AmneziaWG)
        - Обновление стратегий
        - Другое
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Что произошло
      description: Опишите проблему и ожидаемое поведение
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. Открыть «Стратегии»
        2. Нажать «Запустить» на карточке
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Логи
      description: |
        Прикрепите содержимое файлов из `%APPDATA%\ZapretManager\logs\`
        и `security.log`, если он есть.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Проверки
      options:
        - label: Проблема воспроизводится и на чистой установке
          required: false
        - label: Я не изменял системные настройки вручную (VPN/антивирус/прокси)
          required: false
